[package]
name = "docbake"
version = "0.1.15"
edition = "2021"
rust-version = "1.91"

[dependencies]
anyhow = "1.0.98"
blake3 = "1"
clap = { version = "4.5.38", features = ["derive"] }
dirs = "6"
include_dir = "0.7"
regex = "1.11.1"
rushdown = "0.18"
rushdown-footnote = "0.9"
mermaid-rs-renderer = { version = "0.2", default-features = false }
which = "8.0"
rushdown-meta = "0.9"
rushdown-definition-list = "0.9"
rushdown-fenced-div = "0.1" 
rushdown-link-attribute = "0.9" 
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9"
tempfile = "3.20.0"
tera = "1.20.0"
pathdiff = "0.2"
tiny_http = "0.12"
notify = "8"
notify-debouncer-mini = "0.7"
open = "5"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
docx-rs = "0.4"
quick-xml = "0.39"
resvg = "0.47"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
sha2 = "0.11"
rand = "0.10"
similar = { version = "3.1.0", features = ["inline"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
