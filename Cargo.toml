[package]
name = "docbake"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[dependencies]
anyhow = "1.0.98"
blake3 = "1"
clap = { version = "4.5.38", features = ["derive"] }
dirs = "6"
regex = "1.11.1"
rushdown = "0.17"
rushdown-footnote = "0.9"
mermaid-rs-renderer = { version = "0.2", default-features = false }
which = "8.0"
rushdown-meta = "0.9"
rushdown-definition-list = "0.9"
rushdown-fenced-div = "0.1" 
rushdown-link-attribute = "0.9" 
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.20.0"
tera = "1.20.0"
pathdiff = "0.2"
