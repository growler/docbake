name: Pages

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PLANTUML_VERSION: 1.2026.10
  D2_VERSION: 0.9.0
  DRAWIO_VERSION: 32.7.4

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

      - name: Install diagram tools
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"

          # PlantUML: Java is preinstalled on the runner.
          curl -fsSL -o "$RUNNER_TEMP/plantuml.jar" \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          printf '#!/bin/sh\nexec java -Djava.awt.headless=true -jar "%s" "$@"\n' \
            "$RUNNER_TEMP/plantuml.jar" > "$bin/plantuml"

          # D2
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          ln -s "$RUNNER_TEMP/d2-v${D2_VERSION}/bin/d2" "$bin/d2"

          # Draw.io is an Electron app: it needs a virtual display.
          curl -fsSL -o "$RUNNER_TEMP/drawio.deb" \
            "https://github.com/jgraph/drawio-desktop/releases/download/v${DRAWIO_VERSION}/drawio-amd64-${DRAWIO_VERSION}.deb"
          sudo apt-get update
          sudo apt-get install -y xvfb "$RUNNER_TEMP/drawio.deb"
          printf '#!/bin/sh\nexec xvfb-run -a /opt/drawio/drawio --no-sandbox --disable-gpu "$@"\n' \
            > "$bin/drawio"

          chmod +x "$bin"/*
          echo "$bin" >> "$GITHUB_PATH"

      # `build` exits 0 when a diagram tool fails and writes the error into
      # the page. `check` fails on broken diagrams and links.
      - name: Check document
        run: ./target/debug/docbake check -f html -b doc -i doc/en/index.md

      - name: Build site
        run: |
          ./target/debug/docbake build -f site -b doc \
            -i doc/en/index.md -o target/site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
